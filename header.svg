<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 145" width="100%" height="145">
  <defs>
    <!-- Shimmer linear gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtle terminal grid pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .terminal-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.2;
      rx: 10px;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .text-prompt {
      fill: #7ee787;
      font-weight: 700;
      font-size: 13.5px;
    }
    .text-dim {
      fill: #8b949e;
      font-size: 12px;
    }
    .text-cyan {
      fill: #58a6ff;
      font-weight: 600;
      font-size: 13.5px;
    }
    .text-tag {
      fill: #a5d6ff;
      font-size: 12px;
    }
    .status-dot {
      fill: #3fb950;
    }

    /* Blinking terminal cursor */
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    .cursor {
      animation: blink 1.1s infinite;
      fill: #58a6ff;
    }

    /* Radar pulse on status dot */
    @keyframes pulse {
      0% { r: 3.5px; opacity: 0.9; }
      50% { r: 7.5px; opacity: 0.2; }
      100% { r: 8.5px; opacity: 0; }
    }
    .pulse-ring {
      animation: pulse 2.4s ease-out infinite;
      fill: none;
      stroke: #3fb950;
      stroke-width: 1.5;
    }

    /* Smooth text cycle between specialties */
    @keyframes cycle1 {
      0%, 28% { opacity: 1; }
      33%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes cycle2 {
      0%, 30% { opacity: 0; }
      35%, 61% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes cycle3 {
      0%, 63% { opacity: 0; }
      68%, 94% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .cycle-text-1 {
      animation: cycle1 9s infinite;
      fill: #f0f6fc;
      font-size: 14.5px;
      font-weight: 500;
    }
    .cycle-text-2 {
      animation: cycle2 9s infinite;
      fill: #f0f6fc;
      font-size: 14.5px;
      font-weight: 500;
    }
    .cycle-text-3 {
      animation: cycle3 9s infinite;
      fill: #f0f6fc;
      font-size: 14.5px;
      font-weight: 500;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="798" height="143" class="terminal-bg" />

  <!-- Subtle Dot Grid in Background -->
  <rect x="2" y="32" width="796" height="110" fill="url(#grid)" rx="8" />

  <!-- Animated Top Accent Shimmer Line -->
  <path d="M 1 10 Q 1 1 10 1 L 790 1 Q 799 1 799 10" fill="none" stroke="url(#shimmer)" stroke-width="2.5" />

  <!-- Window Header Bar -->
  <line x1="1" y1="31" x2="799" y2="31" stroke="#21262d" stroke-width="1" />
  <circle cx="16" cy="16" r="4.5" fill="#ff5f56" />
  <circle cx="30" cy="16" r="4.5" fill="#ffbd2e" />
  <circle cx="44" cy="16" r="4.5" fill="#27c93f" />
  <text x="64" y="20" class="text-mono text-dim">karim@TheDev20: ~/portfolio</text>

  <!-- Live Status Beacon -->
  <circle cx="700" cy="16" class="pulse-ring" />
  <circle cx="700" cy="16" r="3.5" class="status-dot" />
  <text x="712" y="19.5" class="text-mono text-dim">Available</text>

  <!-- Terminal Content -->
  <!-- Prompt Line with Blinking Cursor -->
  <g transform="translate(22, 63)">
    <text x="0" y="0" class="text-mono text-prompt">❯</text>
    <text x="18" y="0" class="text-mono text-cyan">focus</text>
    <text x="66" y="0" class="text-mono text-dim">--current</text>
    <rect x="146" y="-11" width="8" height="14" class="cursor" />
  </g>

  <!-- Dynamic Role Transition -->
  <g transform="translate(22, 94)">
    <text x="0" y="0" class="text-mono cycle-text-1">Backend Architecture &amp; Scalable REST APIs (.NET 10 / C#)</text>
    <text x="0" y="0" class="text-mono cycle-text-2">Modern Web Frontends &amp; Reactive SPAs (React 19 / TypeScript)</text>
    <text x="0" y="0" class="text-mono cycle-text-3">AI-Grounded Platforms &amp; Tutoring Systems (Trace, Azure)</text>
  </g>

  <!-- Tech Stack Highlights -->
  <g transform="translate(22, 122)">
    <text x="0" y="0" class="text-mono text-dim">stack:</text>
    <text x="48" y="0" class="text-mono text-tag">C# • ASP.NET Core 10 • EF Core • React 19 • TypeScript • SQL Server • Azure</text>
  </g>
</svg>
